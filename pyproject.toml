[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "know-me"
version = "0.1.0"
description = "Know Me — E01 索引、E02 RAG、E03 HTTP Agent、E04 HR、E05 观测与评测"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "chromadb>=0.5",
  "fastapi>=0.115",
  "httpx>=0.27",
  "langchain-text-splitters>=0.2",
  "python-dotenv>=1.0",
  "python-frontmatter>=1.1",
  "pyyaml>=6",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
know-me = "know_me.cli:main"
know-me-index = "know_me.cli:main"

[tool.setuptools]
packages = ["know_me"]

[tool.setuptools.package-data]
know_me = ["web_ui/*.html"]
