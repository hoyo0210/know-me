[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "know-me"
version = "0.1.0"
description = "Know Me — E01 知识管道与索引（MVP）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "chromadb>=0.5",
  "httpx>=0.27",
  "langchain-text-splitters>=0.2",
  "python-frontmatter>=1.1",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.scripts]
know-me-index = "know_me.cli:app"

[tool.setuptools]
packages = ["know_me"]
