[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "know-me"
version = "1.0.0"
description = "Know Me — E01 索引、E02 RAG、E03 HTTP Agent、E04 HR、E05 观测与评测"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "chromadb>=0.5",
  "fastapi>=0.115",
  "httpx>=0.27",
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "langchain-text-splitters>=0.2",
  "python-dotenv>=1.0",
  "python-frontmatter>=1.1",
  "pyyaml>=6",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/hoyo0210/know-me"
Issues = "https://github.com/hoyo0210/know-me/issues"

[project.scripts]
know-me = "know_me.cli:main"
know-me-index = "know_me.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
know_me = [
  "web_ui/*.html",
  "web_ui/*.png",
  "web_ui/resume_dist/**/*",
]
