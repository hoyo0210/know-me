<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Know Me</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    :root {
      /* 深底 + 青绿强调：对比足够、长时间阅读不累 */
      --bg: #0e1217;
      --surface: #161c24;
      --border: #2a3340;
      --surface-raised: color-mix(in srgb, var(--surface) 78%, var(--bg) 22%);
      --surface-chip: color-mix(in srgb, var(--surface) 65%, var(--bg) 35%);
      --text: #e8eef5;
      --muted: #8b96a8;
      --accent: #2dd4bf;
      --user-bg: #0d9488;
      --assistant-bg: #1a222e;
      --code-bg: #0a0f14;
      --error: #fb7185;
      --radius-lg: 14px;
      --radius-md: 12px;
      --radius-sm: 10px;
      --hairline: color-mix(in srgb, var(--border) 42%, transparent);
      --bubble-shade: 0 10px 28px rgba(0, 0, 0, 0.22);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      max-height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(90% 55% at 100% 0%, color-mix(in srgb, var(--accent) 8%, transparent) 0%, transparent 52%),
        radial-gradient(120% 80% at 50% -20%, #152028 0%, var(--bg) 48%),
        var(--bg);
      color: var(--text);
      text-wrap: pretty;
      -webkit-font-smoothing: antialiased;
    }
    @supports (height: 100dvh) {
      html, body {
        height: 100dvh;
        max-height: 100dvh;
      }
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100%;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      min-height: 0;
      overflow: hidden;
    }
    @supports (height: 100dvh) {
      .app {
        max-height: 100dvh;
      }
    }
    header {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 10px 12px;
      padding-top: calc(10px + constant(safe-area-inset-top));
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      padding-right: calc(16px + constant(safe-area-inset-right));
      padding-right: calc(16px + env(safe-area-inset-right, 0px));
      padding-bottom: 10px;
      padding-left: calc(16px + constant(safe-area-inset-left));
      padding-left: calc(16px + env(safe-area-inset-left, 0px));
      min-height: 44px;
      border: none;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .header-viewer-slot {
      justify-self: start;
      min-width: 0;
      max-width: min(200px, 42vw);
      display: flex;
      align-items: center;
    }
    .header-viewer-slot .composer-viewer {
      flex: 1;
      min-width: 0;
      padding-right: 0;
    }
    .app-brand-center {
      justify-self: center;
      min-width: 0;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-align: center;
    }
    .app-brand-center h1 {
      margin: 0;
      font-size: clamp(1rem, 2.8vw, 1.08rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .app-brand-center .meta { font-size: 0.75rem; color: var(--muted); }
    header .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      padding: 0;
      border-radius: 50%;
      border: none;
      background: var(--surface-raised);
      color: var(--muted);
      cursor: pointer;
      line-height: 0;
      flex-shrink: 0;
      transition: color 0.16s ease, background 0.16s ease, transform 0.12s ease;
    }
    header .icon-btn:hover {
      color: var(--text);
      background: color-mix(in srgb, var(--accent) 22%, var(--surface-raised));
    }
    header .icon-btn:active {
      transform: scale(0.96);
    }
    header .icon-btn .icon-btn-svg {
      width: 18px;
      height: 18px;
      display: block;
    }
    .header-right {
      justify-self: end;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding-top: 18px;
      padding-bottom: 18px;
      padding-left: calc(16px + constant(safe-area-inset-left));
      padding-left: calc(16px + env(safe-area-inset-left, 0px));
      padding-right: calc(16px + constant(safe-area-inset-right));
      padding-right: calc(16px + env(safe-area-inset-right, 0px));
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--muted) 38%, transparent) transparent;
    }
    #messages::-webkit-scrollbar {
      width: 7px;
    }
    #messages::-webkit-scrollbar-track {
      background: transparent;
    }
    #messages::-webkit-scrollbar-thumb {
      border-radius: 100px;
      background: color-mix(in srgb, var(--muted) 32%, transparent);
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .msg { display: flex; flex-direction: column; max-width: 92%; animation: fade 0.2s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .msg.user { align-self: flex-end; }
    .msg.assistant { align-self: flex-start; }
    .bubble {
      padding: 12px 15px;
      border-radius: var(--radius-lg);
      line-height: 1.55;
      font-size: 0.95rem;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      color: #f8fafc;
      border-bottom-right-radius: 4px;
      border: 1px solid color-mix(in srgb, #fff 16%, transparent);
      box-shadow: 0 1px 0 color-mix(in srgb, #fff 10%, transparent), var(--bubble-shade);
    }
    .msg.assistant .bubble {
      background: var(--assistant-bg);
      border: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
      border-bottom-left-radius: var(--radius-lg);
      box-shadow: 0 1px 0 color-mix(in srgb, #fff 3%, transparent), var(--bubble-shade);
    }
    .msg.assistant .bubble.assistant-bubble-tail {
      border-bottom-left-radius: 4px;
    }
    .msg.assistant .bubble + .bubble {
      margin-top: 8px;
    }
    .msg.assistant .bubble.streaming {
      background: color-mix(in srgb, var(--assistant-bg) 76%, var(--accent) 24%);
      border-color: color-mix(in srgb, var(--accent) 28%, var(--border) 72%);
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent),
        0 1px 0 color-mix(in srgb, #fff 4%, transparent),
        var(--bubble-shade);
      animation: km-bubble-stream-pulse 2.2s ease-in-out infinite;
    }
    @keyframes km-bubble-stream-pulse {
      0%, 100% {
        border-color: color-mix(in srgb, var(--accent) 22%, var(--border) 78%);
        box-shadow:
          0 0 0 1px color-mix(in srgb, var(--accent) 12%, transparent),
          0 1px 0 color-mix(in srgb, #fff 4%, transparent),
          var(--bubble-shade);
      }
      50% {
        border-color: color-mix(in srgb, var(--accent) 42%, var(--border) 58%);
        box-shadow:
          0 0 0 1px color-mix(in srgb, var(--accent) 28%, transparent),
          0 0 14px color-mix(in srgb, var(--accent) 14%, transparent),
          var(--bubble-shade);
      }
    }
    @keyframes km-stream-status-shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .km-stream-wait {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 1.5em;
    }
    .km-stream-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .km-stream-dots i {
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 55%, var(--muted) 45%);
      animation: km-stream-dot-bounce 1.05s ease-in-out infinite;
    }
    .km-stream-dots i:nth-child(2) { animation-delay: 0.15s; }
    .km-stream-dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes km-stream-dot-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
    .msg.assistant .bubble .km-stream-status {
      margin: 0;
      color: var(--muted);
      font-size: 0.92em;
      line-height: 1.5;
      flex: 1;
      min-width: 0;
    }
    .msg .role .km-phase-label {
      font-weight: 400;
      font-size: 0.68rem;
      color: color-mix(in srgb, var(--accent) 42%, var(--muted) 58%);
      animation: km-phase-label-fade 2s ease-in-out infinite;
    }
    @keyframes km-phase-label-fade {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }
    @supports ((-webkit-background-clip: text) or (background-clip: text)) {
      .msg.assistant .bubble.streaming .km-stream-status {
        background: linear-gradient(
          105deg,
          var(--muted) 0%,
          var(--muted) 38%,
          color-mix(in srgb, var(--text) 82%, var(--accent) 18%) 50%,
          var(--muted) 62%,
          var(--muted) 100%
        );
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: km-stream-status-shimmer 2.35s ease-in-out infinite;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .msg.assistant .bubble.streaming {
        animation: none !important;
      }
      .km-stream-dots i,
      .msg .role .km-phase-label {
        animation: none !important;
      }
      .msg.assistant .bubble.streaming .km-stream-status {
        animation: none !important;
        background: none !important;
        -webkit-text-fill-color: unset !important;
        background-clip: unset !important;
        -webkit-background-clip: unset !important;
        color: var(--muted) !important;
      }
    }
    .msg.assistant.km-floating-status .bubble.bubble-status-meta {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
      padding: 10px 12px;
    }
    #kmFloatingChatStatus[hidden] {
      display: none !important;
    }
    .msg .role {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 5px;
      padding: 0 3px;
      letter-spacing: 0.03em;
      user-select: none;
    }
    .msg .role-label { font-weight: 600; }
    .msg .msg-time {
      font-weight: 400;
      font-size: 0.68rem;
      color: color-mix(in srgb, var(--muted) 82%, transparent);
      font-variant-numeric: tabular-nums;
    }
    .msg-edit-panel {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }
    .msg-edit-panel .msg-feedback {
      margin-top: 0;
      border: none;
      padding: 0;
      justify-content: flex-end;
    }
    .msg.assistant .bubble :is(p, ul, ol) { margin: 0.5em 0; }
    .msg.assistant .bubble p:first-child { margin-top: 0; }
    .msg.assistant .bubble p:last-child { margin-bottom: 0; }
    .msg.assistant .bubble pre {
      background: var(--code-bg);
      border: none;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.85rem;
    }
    .msg.assistant .bubble code { font-family: ui-monospace, monospace; font-size: 0.88em; }
    footer {
      flex-shrink: 0;
      padding-top: 12px;
      padding-right: calc(16px + constant(safe-area-inset-right));
      padding-right: calc(16px + env(safe-area-inset-right, 0px));
      padding-bottom: calc(16px + constant(safe-area-inset-bottom));
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      padding-left: calc(16px + constant(safe-area-inset-left));
      padding-left: calc(16px + env(safe-area-inset-left, 0px));
      border: none;
      background: transparent;
    }
    .composer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
    }
    .composer textarea,
    .msg-edit-panel textarea {
      width: 100%;
      min-height: 44px;
      max-height: 160px;
      resize: none;
      overflow-y: auto;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      border: 1px solid color-mix(in srgb, var(--border) 48%, transparent);
      background: var(--surface-chip);
      color: var(--text);
      font-family: inherit;
      /* iOS：可编辑区小于 16px 时聚焦会强制缩放整页 */
      font-size: max(16px, 0.95rem);
      line-height: 1.45;
      transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }
    .composer textarea::placeholder,
    .msg-edit-panel textarea::placeholder {
      color: color-mix(in srgb, var(--muted) 70%, transparent);
    }
    .composer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      padding-top: 2px;
      min-height: 44px;
      width: 100%;
    }
    .composer-viewer {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-right: 4px;
    }
    .composer-viewer-card {
      max-width: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      padding: 4px 0 4px 2px;
      border-radius: 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .composer-viewer-eyebrow {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--muted) 88%, transparent);
      line-height: 1.2;
      user-select: none;
    }
    .composer-viewer-body {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0 5px;
      min-width: 0;
      max-width: 100%;
      font-size: 0.78rem;
      line-height: 1.35;
    }
    .composer-viewer-name {
      flex: 0 1 auto;
      min-width: 0;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: color-mix(in srgb, var(--text) 92%, var(--muted) 8%);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }
    .composer-viewer-dot {
      flex-shrink: 0;
      color: color-mix(in srgb, var(--muted) 55%, transparent);
      font-weight: 500;
      font-size: 0.85em;
      line-height: 0;
      padding: 0;
      user-select: none;
    }
    .composer-viewer-role {
      flex: 1 1 auto;
      min-width: 0;
      font-weight: 500;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .composer-viewer-job {
      font-size: 0.72rem;
      font-weight: 500;
      color: color-mix(in srgb, var(--accent) 75%, var(--muted) 25%);
      line-height: 1.3;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .composer-viewer--empty .composer-viewer-dot,
    .composer-viewer--empty .composer-viewer-role {
      display: none;
    }
    .composer-viewer--empty .composer-viewer-name {
      font-weight: 500;
      font-size: 0.76rem;
      color: color-mix(in srgb, var(--muted) 92%, transparent);
      font-style: normal;
      white-space: normal;
    }
    .composer textarea:focus,
    .msg-edit-panel textarea:focus {
      outline: none;
      border-color: color-mix(in srgb, var(--accent) 42%, var(--border) 58%);
      background: color-mix(in srgb, var(--surface-chip) 86%, var(--accent) 14%);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
    }
    .composer button#send.icon-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 50%;
      border: none;
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 92%, #fff) 0%, var(--accent) 100%);
      color: #042f2e;
      cursor: pointer;
      line-height: 0;
      box-shadow: none;
    }
    .composer button#send.icon-btn .icon-btn-svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    .composer button#send.icon-btn:hover:not(:disabled) {
      filter: brightness(1.06);
    }
    .composer button#send.icon-btn:active:not(:disabled) {
      filter: brightness(0.96);
      transform: translateY(1px);
    }
    .composer button#send.icon-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: none;
      transform: none;
    }
    header .icon-btn:focus-visible,
    .composer button#send.icon-btn:focus-visible,
    .composer textarea:focus-visible,
    .msg-edit-panel textarea:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    .msg-feedback-wrap {
      margin-top: 6px;
      max-width: 100%;
      align-self: stretch;
      width: 100%;
    }
    /* 编辑模式：气泡已换成 msg-edit-panel，隐藏面板下方的「编辑并重答」条（保存/取消在面板内） */
    .msg.user:has(.msg-edit-panel) > .msg-feedback-wrap {
      display: none;
    }
    .msg-action-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-height: 30px;
    }
    .msg-feedback {
      display: flex;
      flex-wrap: nowrap;
      gap: 4px;
      align-items: center;
      flex: 0 0 auto;
    }
    .msg-feedback-hint {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.4;
      margin-top: 6px;
      padding: 6px 8px;
      border-radius: 8px;
      border: none;
      background: color-mix(in srgb, var(--surface-chip) 92%, var(--muted) 8%);
      max-width: 100%;
    }
    .msg-feedback .fb {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      min-width: 30px;
      min-height: 30px;
      padding: 0;
      border-radius: 50%;
      border: none;
      background: var(--surface-raised);
      color: var(--text);
      cursor: pointer;
      line-height: 0;
      box-sizing: border-box;
    }
    .msg-feedback .fb .fb-svg {
      display: block;
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .msg-feedback .fb:hover {
      color: var(--text);
      background: color-mix(in srgb, var(--accent) 18%, var(--surface-raised));
    }
    .msg-feedback .fb.pressed {
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 22%, var(--surface-raised));
    }
    .msg-feedback .fb:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .msg-feedback .fb-regen .fb-svg,
    .msg-feedback .fb-edit .fb-svg,
    .msg-feedback .fb-edit-save .fb-svg,
    .msg-feedback .fb-edit-cancel .fb-svg {
      width: 14px;
      height: 14px;
    }
    .msg-feedback .fb:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .msg-version-bar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
      margin: 0;
      margin-left: auto;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.3;
      flex: 0 0 auto;
    }
    .msg-version-bar .vb-nav {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .msg-version-bar .vb-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      min-width: 30px;
      min-height: 30px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: var(--surface-raised);
      color: var(--text);
      cursor: pointer;
      line-height: 0;
      box-sizing: border-box;
      font-size: 1rem;
    }
    .msg-version-bar .vb-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .msg-version-bar .vb-btn:not(:disabled):hover {
      color: var(--text);
      background: color-mix(in srgb, var(--accent) 18%, var(--surface-raised));
    }
    .msg-version-bar .vb-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .msg-version-bar .vb-label {
      white-space: nowrap;
      padding: 0 2px;
      line-height: 30px;
    }

    .composer-resume-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;

  <script>window.__KM_HTTP_ROOT = %%KNOW_ME_HTTP_ROOT%%;</script>

  <script>
(function () {
  function apiUrl(path) {
    if (!path || path.charAt(0) !== "/") path = "/" + (path || "");
    var root = typeof window.__KM_HTTP_ROOT === "string" ? String(window.__KM_HTTP_ROOT).trim() : "";
    if (!root) return path;
    return root.replace(/\/+$/, "") + path;
  }
  function getResumeHref() {
    var u = typeof window.__KM_RESUME_URL === "string" ? String(window.__KM_RESUME_URL).trim() : "";
    if (u && u.indexOf("%%") !== 0) return u;
    return apiUrl("/resume");
  }
  function syncFooterResumeLink() {
    var a = document.getElementById("resumePageLink");
    if (!a) return;
    a.setAttribute("href", getResumeHref());
  }
  syncFooterResumeLink();
  const LS_KEY = "know_me_session_id";
  /** 与 LS 同步，避免部分环境下仅 localStorage 异常导致刷新后变成新会话 */
  const SS_SESSION_BACKUP = "know_me_session_id_ss";
  /** 本标签页内已为该 session_id 展示过开场（含仅 POST /session、尚无 DB 消息时），刷新不再重复插入 */
  const SS_OPENING_DONE = "know_me_opening_done_sid";
  const WELCOME_DONE_KEY = "know_me_welcome_done";
  const VIEWER_PROFILE_KEY = "know_me_viewer_profile";
  /** 与 /session 返回的 opening 一致，供首轮 POST /chat 的 session_opening_for_context */
  const SESSION_OPENING_KEY = "know_me_session_opening";
  /** 是否通过 ?session= 进入（跳过欢迎页、直接恢复会话） */
  var enteredViaSessionQuery = false;

  function getSessionId() {
    try {
      var a = localStorage.getItem(LS_KEY);
      if (a && String(a).trim()) return String(a).trim().slice(0, 128);
      var b = sessionStorage.getItem(SS_SESSION_BACKUP);
      if (b && String(b).trim()) return String(b).trim().slice(0, 128);
    } catch (_) {}
    return null;
  }
  function setSessionId(id) {
    try {
      if (id) {
        var v = String(id).trim().slice(0, 128);
        localStorage.setItem(LS_KEY, v);
        sessionStorage.setItem(SS_SESSION_BACKUP, v);
      } else {
        localStorage.removeItem(LS_KEY);
        sessionStorage.removeItem(SS_SESSION_BACKUP);
      }
    } catch (_) {
      try {
        if (id) sessionStorage.setItem(SS_SESSION_BACKUP, String(id).trim().slice(0, 128));
        else sessionStorage.removeItem(SS_SESSION_BACKUP);
      } catch (_) {}
    }
  }
  function getOpeningDoneSid() {
    try {
      var s = sessionStorage.getItem(SS_OPENING_DONE);
      return s && String(s).trim() ? String(s).trim().slice(0, 128) : null;
    } catch (_) {
      return null;
    }
  }
  function setOpeningDoneSid(sid) {
    if (!sid) return;
    try {
      sessionStorage.setItem(SS_OPENING_DONE, String(sid).trim().slice(0, 128));
    } catch (_) {}
  }
  function clearOpeningDoneSid() {
    try {
      sessionStorage.removeItem(SS_OPENING_DONE);
    } catch (_) {}
  }

  function showWelcomeErr(msg, isWarn) {
    if (!welcomeErrEl) return;
    if (msg) {
      welcomeErrEl.textContent = msg;
      welcomeErrEl.hidden = false;
      welcomeErrEl.classList.toggle("welcome-warn", !!isWarn);
    } else {
      welcomeErrEl.textContent = "";
      welcomeErrEl.hidden = true;
      welcomeErrEl.classList.remove("welcome-warn");
    }
  }

  var KM_BAD_PLACEHOLDER_EXACT = {
    test: 1, testing: 1, null: 1, none: 1, "n/a": 1, na: 1, abc: 1, asd: 1, asdf: 1, xxx: 1,
    "111": 1, "123": 1, "666": 1, "888": 1,
    "测试": 1, "试试": 1, "随便": 1, "随意": 1, "无": 1, "没有": 1, "暂无": 1, "待定": 1,
    "未知": 1, "不明": 1, "哈哈": 1, "啊啊啊": 1, "。。。": 1, "...": 1, "——": 1, "-": 1,
    "找工作": 1, "求职": 1, "应聘": 1, "找工作中": 1, "看机会": 1, "随便填": 1, "填着玩": 1, "测试一下": 1
  };

  function isCredibleViewerDisplayName(s) {
    var t = (s || "").trim().replace(/\s+/g, " ");
    if (!t) return false;
    var low = t.toLowerCase();
    if (KM_BAD_PLACEHOLDER_EXACT[low] || KM_BAD_PLACEHOLDER_EXACT[t]) return false;
    if (/^[\d\s\W_]+$/.test(t)) return false;
    var compact = t.replace(/\s/g, "");
    if (compact.length < 2) return false;
    if (!/[\u4e00-\u9fff]|[a-zA-Z]{2,}/i.test(t)) return false;
    return true;
  }

  /** 与后端 is_credible_recruiter_job_title 启发式对齐（空串视为无需校验） */
  function isCredibleRecruiterJobTitle(s) {
    var t = (s || "").trim().replace(/\s+/g, " ");
    if (!t) return true;
    var low = t.toLowerCase();
    if (KM_BAD_PLACEHOLDER_EXACT[low] || KM_BAD_PLACEHOLDER_EXACT[t]) return false;
    if (/^[\d\s\W_]+$/.test(t)) return false;
    var compact = t.replace(/\s/g, "");
    if (compact.length < 2) return false;
    if (compact.length >= 3 && /^(.)\1+$/.test(compact)) return false;
    if (/(找工作|求职中|在看机会|看机会呢|投简历|海投|换工作|跳槽中)/.test(t) && compact.length <= 12) return false;
    if (!/[\u4e00-\u9fff]{2,}|[a-zA-Z]{2,}/i.test(t)) return false;
    if (compact.length <= 3 && !/[\u4e00-\u9fff]/.test(t)) return false;
    return true;
  }

  function attachVersionBar(wrap, meta) {
    if (!wrap || !meta || !meta.versions || meta.versions.length <= 1) {
      var shell0 = wrap.querySelector(".msg-action-row");

        var old = shell0.querySelector(".msg-version-bar");

        ? Number(meta.version_total)

    var pos1 =

        ? Number(meta.version_pos)
        : versionListPos(meta.versions, meta.active_version_index) + 1;
    if (!isFinite(pos1) || pos1 < 1) pos1 = 1;
    if (pos1 > total) pos1 = total;
    var idx = pos1 - 1;

  async function refreshMessageVersions(anchorSeq) {

    if (!isFinite(sq) || sq < 0) return;
    var sid = getSessionId();
    if (!sid || !String(sid).trim()) return;
    try {
      var res = await fetch(apiUrl("/session/" + encodeURIComponent(String(sid).trim()) + "/history"));
      if (!res.ok) return;
      var j = await res.json();
      if (!j.messages || !j.messages.length) return;
      for (var i = 0; i < j.messages.length; i++) {
        var m = j.messages[i];
        if (Number(m.seq) !== sq) continue;
        var wrap = messagesEl.querySelector('.msg[data-seq="' + sq + '"]');
        if (!wrap) return;

  async function switchMessageVersion(wrap, targetVersionIndex) {

    if (!sid || !String(sid).trim()) {
      showError("无法切换版本：请先建立会话");
      return;
    }
    var meta = wrap._kmVersionMeta;
    if (!meta || !meta.versions) return;
    var ver = versionAt(meta, targetVersionIndex);
    if (!ver) return;
    showError("");
    try {
      var res = await fetch(
        apiUrl(
          "/session/" +
            encodeURIComponent(String(sid).trim()) +
            "/messages/" +
            sq +
            "/active-version",
        ),
        {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ version_index: Number(targetVersionIndex) }),
        },
      );
      if (!res.ok) {
        var errT = await res.text();
        throw new Error(errT || "HTTP " + res.status);
      }
      var j = await res.json();
      var msg = j.message;
      var baseMeta = messageMetaFromRecord(msg) || wrap._kmVersionMeta;
      var showVer = versionAt(baseMeta, targetVersionIndex) || ver;
      applyVersionToWrap(wrap, showVer, baseMeta);
      if (msg) syncVersionBarFromServerRecord(wrap, msg);
      else if (baseMeta) attachVersionBar(wrap, baseMeta);

      showError("切换版本失败：" + String(err).slice(0, 200));

  async function parseSseStream(response, onEvent) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let sep;
      while ((sep = buffer.indexOf("\n\n")) !== -1) {
        const block = buffer.slice(0, sep);
        buffer = buffer.slice(sep + 2);
        block.split("\n").forEach(function (line) {
          if (line.startsWith("data:")) {
            const payload = line.slice(5).trimStart();
            if (payload === "[DONE]") return;
            try {
              onEvent(JSON.parse(payload));
            } catch (e) {
              console.warn("SSE parse", e);
            }
          }
        });
      }
    }
    if (buffer.trim()) {
      buffer.split("\n").forEach(function (line) {
        if (line.startsWith("data:")) {
          const payload = line.slice(5).trimStart();
          try {
            onEvent(JSON.parse(payload));
          } catch (_) {}
        }
      });
    }
  }

  async function runChatStream(ctx) {
    var bubble = ctx.bubble;
    var userWrap = ctx.userWrap || null;
    var body = ctx.body;
    sseStatusAssistantWrap = bubble && bubble.closest ? bubble.closest(".msg.assistant") : null;
    var full = "";
    /** 与 SSE `delta.text`（及同条内的 `session.opening`）顺序一致，用于收束后按后端粒度拆气泡 */
    var deltaSegments = [];
    var bubbleRaf = null;
    var lastMid = "";

    function flushStreamingBubble() {
      bubbleRaf = null;
      if (!bubble.classList.contains("streaming")) return;
      var wrap = bubble.closest(".msg.assistant");
      if (!full.trim()) {
        var inline =
          bubble.dataset && bubble.dataset.kmInlineStatus != null
            ? String(bubble.dataset.kmInlineStatus).trim()
            : KM_DEFAULT_STREAM_STATUS;
        bubble.setAttribute("role", "status");
        bubble.setAttribute("aria-live", "polite");
        bubble.title = inline;
        bubble.innerHTML = renderStreamStatusHtml(inline);
      } else {
        markBubbleStreamHasContent(bubble);
        try {
          delete bubble.dataset.kmInlineStatus;
        } catch (_) {
          bubble.removeAttribute("data-km-inline-status");
        }
        bubble.removeAttribute("title");
        bubble.removeAttribute("role");
        bubble.removeAttribute("aria-live");
        bubble.innerHTML = renderMarkdown(full);
        if (wrap) setAssistantPhaseLabel(wrap, "");
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function scheduleStreamingUpdate() {
      if (bubbleRaf != null) return;
      bubbleRaf = requestAnimationFrame(flushStreamingBubble);
    }

    try {
      const res = await fetch(apiUrl("/chat"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(mergeViewerIntoChatBody(Object.assign({}, body))),
      });
      if (!res.ok) {
        const errText = await res.text();
        bubble.classList.remove("streaming");
        bubble.innerHTML = "<p>请求失败（" + res.status + "）</p><pre>" + escapeHtml(errText.slice(0, 800)) + "</pre>";
        return;
      }
      await parseSseStream(res, function (ev) {
        if (ev.type === "session") {
          if (ev.session_id) setSessionId(ev.session_id);
          var sidMid = ev.message_id != null ? String(ev.message_id).trim() : "";
          if (sidMid.length >= 8) lastMid = sidMid;
          if (ev.disclaimer) setStatus(ev.disclaimer);
          if (ev.opening && typeof ev.opening === "string") {
            full += ev.opening;
            deltaSegments.push(ev.opening);
            if (ev.session_id) setOpeningDoneSid(ev.session_id);
            scheduleStreamingUpdate();
          }
        } else if (ev.type === "status" && ev.message) {
          setStatus(ev.message);
        } else if (ev.type === "clarify" && ev.question) {
          setStatus("需要您补充：" + ev.question);
        } else if (ev.type === "delta") {
          if (ev.text === undefined || ev.text === null) return;
          var dch = String(ev.text);
          if (dch.trim()) {
            markBubbleStreamHasContent(bubble);
            var dw = bubble.closest(".msg.assistant");
            if (dw) setAssistantPhaseLabel(dw, "");
          }
          full += dch;
          deltaSegments.push(dch);
          scheduleStreamingUpdate();
        } else if (ev.type === "done") {
          full = ev.answer != null && String(ev.answer).length ? String(ev.answer) : full;
          var doneMid = ev.message_id != null ? String(ev.message_id).trim() : "";
          if (doneMid.length >= 8) lastMid = doneMid;
          prefaceShownForServer = false;
          if (bubbleRaf != null) {
            cancelAnimationFrame(bubbleRaf);
            bubbleRaf = null;
          }
          var asq = ev.assistant_seq;
          var segPass =
            deltaSegments.length && deltaSegments.join("") === full ? deltaSegments : undefined;
          finishAssistantBubble(bubble, full, lastMid, null, asq, segPass);
          if (asq !== undefined && asq !== null && asq !== "") {
            var aWrap = bubble.closest(".msg.assistant");
            if (ev.versions && ev.version_total > 1 && aWrap) {
              syncVersionBarFromServerRecord(aWrap, ev);
            } else {
              refreshMessageVersions(asq);
            }
          }
          if (userWrap != null && asq !== undefined && asq !== null && asq !== "") {
            userWrap.setAttribute("data-seq", String(Number(asq) - 1));
            syncUserEditButton(userWrap);
            if (ev.user_version_ui) {
              syncVersionBarFromServerRecord(userWrap, ev.user_version_ui);
            } else {
              refreshMessageVersions(Number(asq) - 1);
            }
          }
          setStatus("");
          busy = false;
          sendBtn.disabled = false;
        } else if (ev.type === "error") {
          if (bubbleRaf != null) {
            cancelAnimationFrame(bubbleRaf);
            bubbleRaf = null;
          }
          bubble.classList.remove("streaming");
          bubble.innerHTML = "<p style=\"color:var(--error)\">" + escapeHtml(ev.message || "错误") + "</p>";
          busy = false;
          sendBtn.disabled = false;
        }
      });
      if (bubble.classList.contains("streaming")) {
        if (bubbleRaf != null) {
          cancelAnimationFrame(bubbleRaf);
          bubbleRaf = null;
        }
        finishAssistantBubble(
          bubble,
          full,
          lastMid,
          null,
          undefined,
          deltaSegments.length && deltaSegments.join("") === full ? deltaSegments : undefined,
        );
      }
    } catch (e) {
      bubble.classList.remove("streaming");
      bubble.innerHTML = "<p style=\"color:var(--error)\">" + escapeHtml(String(e)) + "</p>";
    } finally {
      var w = sseStatusAssistantWrap;
      sseStatusAssistantWrap = null;
      if (w) clearStreamInlineStatusOnWrap(w);
    }
  }

    try {
      if (!sid) return;
      const res = await fetch(apiUrl("/session/" + encodeURIComponent(sid) + "/history"));
      if (!res.ok) return;
      const j = await res.json();
      if (!j.messages || !j.messages.length) return;
      messagesEl.innerHTML = "";
      for (var i = 0; i < j.messages.length; i++) {
        var m = j.messages[i];
        var usq = typeof m.seq === "number" ? m.seq : null;
        var asq = typeof m.seq === "number" ? m.seq : null;
        var vmeta = messageMetaFromRecord(m);
        if (m.role === "user" && m.content)
          appendUserBubble(String(m.content), usq, m.created_at_ms, vmeta);
        else if (m.role === "assistant" && m.content)
          appendAssistantStatic(String(m.content), m.message_id, m.vote, {
            showFeedbackHint: true,
            seq: asq,
            created_at_ms: m.created_at_ms,
            versionMeta: vmeta,
          });
      }
      historyRestoredFromDb = true;
      prefaceShownForServer = true;
      setOpeningDoneSid(sid);
      setSessionOpeningText("");
      if (j.viewer_display_name && j.viewer_role) {
        try {
          var prof = {
            display_name: String(j.viewer_display_name).trim().slice(0, 64),
            role: String(j.viewer_role).trim().slice(0, 64),
          };
          if (j.recruiter_job_title) {
            prof.recruiter_job_title = String(j.recruiter_job_title).trim().slice(0, 256);
          }
          if (j.recruiter_contact) {
            prof.recruiter_contact = String(j.recruiter_contact).trim().slice(0, 128);
          }
          sessionStorage.setItem(VIEWER_PROFILE_KEY, JSON.stringify(prof));
          markWelcomeDone();
        } catch (_) {}
      }
    } catch (_) {
    } finally {
      syncComposerViewerProfile();
    }
  }

  async function ensureSessionOpening() {
    var ok = false;
    try {
      var base = { session_id: getSessionId() };
      var vp = getViewerProfileForApi();
      if (!getSessionOpeningText()) {
        if (vp.viewer_display_name) base.viewer_display_name = vp.viewer_display_name;
        if (vp.viewer_role) base.viewer_role = vp.viewer_role;
      }
      if (vp.recruiter_job_title) base.recruiter_job_title = vp.recruiter_job_title;
      if (vp.recruiter_contact) base.recruiter_contact = vp.recruiter_contact;
      const res = await fetch(apiUrl("/session"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(base),
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error(t || "HTTP " + res.status);
      }
      const j = await res.json();
      if (j.session_id) setSessionId(j.session_id);
      if (j.opening) setSessionOpeningText(j.opening);
      var localOp = getSessionOpeningText();
      var openingToShow = j.opening || localOp || null;
      if (openingToShow) {
        var hasAnyMsg = messagesEl.querySelector(".msg");
        /* 已从 DB 渲染过（含开场）则切勿再插一条；opening_done_sid 与 session 不一致时也曾导致双开场 */
        if (hasAnyMsg && (historyRestoredFromDb || getOpeningDoneSid() === j.session_id)) {
          prefaceShownForServer = true;
          if (j.session_id) setOpeningDoneSid(j.session_id);
        } else {
          appendAssistantStatic(openingToShow);
          setOpeningDoneSid(j.session_id);
          prefaceShownForServer = true;
        }
      } else if (!historyRestoredFromDb) {
        prefaceShownForServer = false;
      }
      ok = true;
    } catch (e) {
      showError("无法建立会话：" + String(e).slice(0, 240));
      if (!historyRestoredFromDb) {
        prefaceShownForServer = false;
        clearWelcomeDone();
      }
    }
    return ok;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    showError("");
    resetInput();
    const userWrap = appendUserBubble(text);
    const shell = appendAssistantShell();
    setStatus(KM_DEFAULT_STREAM_STATUS);
    try {
      await runChatStream({
        bubble: shell.bubble,
        userWrap: userWrap,
        body: {
          session_id: getSessionId(),
          message: text,
          stream: true,
          preface_shown: prefaceShownForServer,
        },
      });
    } finally {
      busy = false;
      sendBtn.disabled = false;
      resetInput();
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.shiftKey) return;
    // 正在拼音/选字：勿拦截 Enter，否则无法上屏或会与清空逻辑打架
    if (e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    sendMessage();
  });

  newChatBtn.addEventListener("click", async function () {
    clearOpeningDoneSid();
    setSessionId(null);
    messagesEl.innerHTML = "";
    showError("");
    historyRestoredFromDb = false;
    prefaceShownForServer = false;
    try {
      clearWelcomeDone();
      sessionStorage.removeItem(VIEWER_PROFILE_KEY);
      sessionStorage.removeItem(SESSION_OPENING_KEY);
    } catch (_) {}
    showWelcomeOverlay();
    setStatus("请先完成上方信息。");
    resetInput();
    syncComposerViewerProfile();
  });

  fetch(apiUrl("/health"))
    .then(function (r) {
      return r.json();
    })
    .then(function (j) {
      var t = j.version ? "v" + j.version : "已连接";
      if (versionMeta) versionMeta.textContent = t;
      if (welcomeVersionMeta) welcomeVersionMeta.textContent = t;
    })
    .catch(function () {
      if (versionMeta) versionMeta.textContent = "健康检查失败";
      if (welcomeVersionMeta) welcomeVersionMeta.textContent = "健康检查失败";
    });

  applySessionFromUrl();
  syncComposerViewerProfile();
  (function syncSessionStores() {
    var s = getSessionId();
    if (s) setSessionId(s);
  })();
  loadPersistedHistory().finally(function () {
    unlockPageScrollFromWelcome();
    if (shouldSkipWelcome()) {
      hideWelcomeOverlay();
      startChatShellAfterWelcome().then(function (ok) {
        if (!ok && !historyRestoredFromDb) {
          showWelcomeOverlay();
          showWelcomeErr("会话未能建立，请检查网络后刷新或重试。", false);
        }
      });
    } else {
      clearWelcomeDone();
      showWelcomeOverlay();
      setStatus("");
    }
  });

  if (welcomeOkBtn) {
    welcomeOkBtn.addEventListener("click", async function () {
      var name = welcomeNameInput ? welcomeNameInput.value.trim() : "";
      if (!name) {
        showWelcomeErr("请填写称呼");
        if (welcomeNameInput) welcomeNameInput.focus();
        return;
      }
      if (!isCredibleViewerDisplayName(name)) {
        showWelcomeErr("称呼请勿使用「测试」等占位词，请填写真实称呼（如张先生、李女士）。");
        if (welcomeNameInput) welcomeNameInput.focus();
        return;
      }
      var roleSave = getSelectedWelcomeRole();
      if (!roleSave) {
        showWelcomeErr("选择「其他」时请补充您的身份");
        if (welcomeRoleOtherInput) welcomeRoleOtherInput.focus();
        return;
      }
      var jobSave = welcomeJobInput ? welcomeJobInput.value.trim().slice(0, 256) : "";
      var contactSave = welcomeContactInput ? welcomeContactInput.value.trim().slice(0, 128) : "";
      if (jobSave && !isCredibleRecruiterJobTitle(jobSave)) {
        showWelcomeErr("岗位描述较简略或像占位填写，建议填写真实岗位名称；仍可直接开始对话。", true);
      } else {
        showWelcomeErr("");
      }
      welcomeOkBtn.disabled = true;
      try {
        try {
          var profSave = { display_name: name, role: roleSave };
          if (jobSave) profSave.recruiter_job_title = jobSave;
          if (contactSave) profSave.recruiter_contact = contactSave;
          sessionStorage.setItem(VIEWER_PROFILE_KEY, JSON.stringify(profSave));
        } catch (_) {}
        syncComposerViewerProfile();
        setSessionOpeningText("");
        setStatus("");
        var started = await startChatShellAfterWelcome();
        if (!started) {
          clearWelcomeDone();
          showWelcomeOverlay();
          showWelcomeErr("无法开始对话，请检查网络后点「确定」重试，或直接刷新页面。", false);
          return;
        }
        markWelcomeDone();
        hideWelcomeOverlay();
        inputEl.focus();
      } catch (e) {
        clearWelcomeDone();
        showWelcomeOverlay();
        showWelcomeErr("无法开始对话：" + String(e).slice(0, 120), false);
        showError(String(e).slice(0, 240));
      } finally {
        welcomeOkBtn.disabled = false;
        unlockPageScrollFromWelcome();
      }
    });
  }
  if (welcomeNameInput) {
    welcomeNameInput.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" || e.shiftKey) return;
      if (e.isComposing || e.keyCode === 229) return;
      e.preventDefault();
      if (welcomeOkBtn && !welcomeOkBtn.disabled) welcomeOkBtn.click();
    });
  }
  if (welcomeRoleOtherInput) {
    welcomeRoleOtherInput.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" || e.shiftKey) return;
      if (e.isComposing || e.keyCode === 229) return;
      e.preventDefault();
      if (welcomeOkBtn && !welcomeOkBtn.disabled) welcomeOkBtn.click();
    });
  }
  if (welcomeJobInput) {
    welcomeJobInput.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" || e.shiftKey) return;
      if (e.isComposing || e.keyCode === 229) return;
      e.preventDefault();
      if (welcomeContactInput) welcomeContactInput.focus();
      else if (welcomeOkBtn && !welcomeOkBtn.disabled) welcomeOkBtn.click();
    });
  }
  if (welcomeContactInput) {
    welcomeContactInput.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" || e.shiftKey) return;
      if (e.isComposing || e.keyCode === 229) return;
      e.preventDefault();
      if (welcomeOkBtn && !welcomeOkBtn.disabled) welcomeOkBtn.click();
    });
  }
})();
  </script>
</body>
</html>
